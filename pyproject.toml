[build-system]
requires = [
    "setuptools>=68",
]
build-backend = "setuptools.build_meta"

[project]
name = "OctoPrint-Dashboard"
version = "1.19.13"
description = "A dashboard tab for Octoprint that displays the most relevant info regarding the state of the printer and any on-going print jobs."
authors = [
    { name = "j7126", email = "jeffereyneuffer@gmail.com" },
]
requires-python = ">=3.7,<4"
dependencies = [
    "psutil",
]
dynamic = [
    "license",
]

[project.entry-points."octoprint.plugin"]
dashboard = "octoprint_dashboard"

[project.urls]
Homepage = "https://github.com/j7126/OctoPrint-Dashboard"

[project.optional-dependencies]
develop = [
    "go-task-bin",
]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = [
    "octoprint_dashboard",
    "octoprint_dashboard.*",
]
